name: PostgreSQL Tools

description: >
  Create, list and restore PostgreSQL backups using a temporary
  db-tools pod running inside AKS.

inputs:

  operation:
    description: >
      backup | list-backups | restore | restore-custom
    required: true

  azure-client-id:
    description: Azure client ID
    required: true

  azure-subscription-id:
    description: Azure subscription ID
    required: true

  azure-tenant-id:
    description: Azure tenant ID
    required: true

  cluster-name:
    description: AKS cluster name
    required: true

  cluster-rg:
    description: Resource group containing the AKS cluster
    required: true

  namespace:
    description: Kubernetes namespace
    required: true

  storage-account-name:
    description: Azure storage account name for backups
    required: true

  deployment-name:
    description: Kubernetes deployment name
    required: true

  db-tools-pod-name:
    description: Name for the PostgreSQL tools pod
    required: true

  container-name:
    description: Azure storage container name for backups
    required: true

  restore-file:
    description: Backup file to restore
    required: false

  destination-server:
    description: Target PostgreSQL server for restore-custom
    required: false

  destination-database:
    description: Target PostgreSQL database for restore-custom
    required: false

outputs:
  backup_filename:
    description: Filename of the successfully created PostgreSQL backup
    value: ${{ steps.execute_operation.outputs.backup_filename }}

runs:
  using: composite

  steps:

    - name: Install kubectl
      uses: DFE-Digital/github-actions/set-kubectl@master

    - name: Set kubelogin environment
      uses: DFE-Digital/github-actions/set-kubelogin-environment@master
      with:
        azure-client-id: ${{ inputs.azure-client-id }}
        azure-subscription-id: ${{ inputs.azure-subscription-id }}
        azure-tenant-id: ${{ inputs.azure-tenant-id }}

    - name: Make scripts executable
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/scripts/"*.sh

    - name: Configure cluster
      shell: bash
      env:
        CLUSTER_RG: ${{ inputs.cluster-rg }}
        CLUSTER_NAME: ${{ inputs.cluster-name }}
      run: |
        az aks get-credentials \
          --overwrite-existing \
          -g "${CLUSTER_RG}" \
          -n "${CLUSTER_NAME}"

        kubelogin convert-kubeconfig -l "${AAD_LOGIN_METHOD}"

    - name: Discover secret reference
      shell: bash
      env:
        DEPLOYMENT_NAME: ${{ inputs.deployment-name }}
        NAMESPACE: ${{ inputs.namespace }}
      run: |

        SECRET_REF_NAME=$(
          kubectl get deployment "${DEPLOYMENT_NAME}" \
            -n "${NAMESPACE}" \
            -o json |
          jq -r '.spec.template.spec.containers[].envFrom[]?.secretRef?.name // empty' |
          head -1
        )

        if [ -z "${SECRET_REF_NAME}" ]; then
          echo "Unable to determine SECRET_REF_NAME"
          exit 1
        fi

        echo "SECRET_REF_NAME=${SECRET_REF_NAME}" >> "$GITHUB_ENV"

    - name: Create backup SAS secret
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        RESTORE_FILE: ${{ inputs.restore-file }}
        STORAGE_ACCOUNT_NAME: ${{ inputs.storage-account-name }}
        CONTAINER_NAME: ${{ inputs.container-name }}
        NAMESPACE: ${{ inputs.namespace }}
      run: |

        EXPIRY=$(
          python3 -c 'from datetime import datetime,timedelta,timezone; print((datetime.now(timezone.utc)+timedelta(hours=2)).strftime("%Y-%m-%dT%H:%MZ"))'
        )

        export EXPIRY

        case "${OPERATION}" in

          backup)

            export SAS_PERMISSIONS="cw"

            TODAY=$(date +"%F_%H%M%S")

            export BLOB_URL="https://${STORAGE_ACCOUNT_NAME}.blob.core.windows.net/${CONTAINER_NAME}/postgres-backup-${TODAY}.sql"
            echo "BACKUP_FILENAME=${BLOB_URL##*/}" >> "$GITHUB_ENV"

            ;;

          list-backups)

            export SAS_PERMISSIONS="rl"

            export BLOB_URL="https://${STORAGE_ACCOUNT_NAME}.blob.core.windows.net/${CONTAINER_NAME}"

            ;;

          restore|restore-custom)

            export SAS_PERMISSIONS="r"

            export BLOB_URL="https://${STORAGE_ACCOUNT_NAME}.blob.core.windows.net/${CONTAINER_NAME}/${RESTORE_FILE}"

            ;;

          *)

            echo "Unknown operation: ${OPERATION}"
            exit 1

            ;;

        esac

        "${{ github.action_path }}/scripts/create-backup-secret.sh"

    - name: Create db tools pod
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        DB_TOOLS_POD_NAME: ${{ inputs.db-tools-pod-name }}
      run: |

        export TEMPLATE_FILE="${{ github.action_path }}/templates/db-pod.yaml.tpl"

        export SECRET_REF_NAME

        "${{ github.action_path }}/scripts/create-db-tools-pod.sh"

    - name: Execute operation
      id: execute_operation
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        DESTINATION_SERVER: ${{ inputs.destination-server }}
        DESTINATION_DATABASE: ${{ inputs.destination-database }}
        NAMESPACE: ${{ inputs.namespace }}
        DB_TOOLS_POD_NAME: ${{ inputs.db-tools-pod-name }}
      run: |

        export CLEANUP_DB_TOOLS_POD=true

        case "${OPERATION}" in

          backup)

            "${{ github.action_path }}/scripts/db-backup.sh"

            ;;

          list-backups)

            "${{ github.action_path }}/scripts/db-list-backups.sh"

            ;;

          restore)

            "${{ github.action_path }}/scripts/db-restore.sh"

            ;;

          restore-custom)

            export DESTINATION_SERVER
            export DESTINATION_DATABASE

            "${{ github.action_path }}/scripts/db-restore-custom-target.sh"

            ;;

          *)

            echo "Unknown operation: ${OPERATION}"
            exit 1

            ;;

        esac

        if [ "${OPERATION}" = "backup" ]; then
          echo "backup_filename=${BACKUP_FILENAME}" >> "$GITHUB_OUTPUT"
          printf '## PostgreSQL backup\n\n`%s`\n' "${BACKUP_FILENAME}" >> "$GITHUB_STEP_SUMMARY"
        fi