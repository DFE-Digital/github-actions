name: Test Teams Message Truncation

on:
  push:
    branches:
      - 2913-truncate-teams-message-test

jobs:
  test-truncation:
    runs-on: ubuntu-latest

    steps:
      - name: Send Teams notification with oversized message
        uses: DFE-Digital/github-actions/send-to-teams-channel@2913-truncate-teams-message-test
        with:
          teams-webhook-url: ${{ secrets.TEST_TEAMS_WEBHOOK_URL }}
          title: Teams Truncation Test
          service: github-actions
          status: warning
          message: |
            